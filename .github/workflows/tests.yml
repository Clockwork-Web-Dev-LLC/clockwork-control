name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Only the coverage-badge job (push-to-main only) needs write access, to
# commit .github/badges/coverage.json back via the default GITHUB_TOKEN.
# Every other step — including the test job itself — is read-only so a
# compromised test step cannot push to main.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, bcmath, curl, openssl, tokenizer, xml, ctype, json
          # pcov over Xdebug: coverage-only, no step-debugger overhead — the
          # right choice for a CI run that only ever needs the numbers.
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Audit Composer dependencies
        run: composer audit

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build frontend assets
        run: npm run build

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate --ansi

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: composer phpstan

      - name: Run tests with coverage (Pest)
        # --min=0 : reporting, not gatekeeping — the plan for this phase is
        # visibility (a real number in the job summary + badge), not an
        # enforced coverage floor that would need a considered, separately-
        # chosen threshold to be meaningful rather than arbitrary.
        # --exclude-group=network : one test (TwilioCheckTest) makes a real
        # round-trip to Twilio's live API — the Twilio SDK hard-instantiates
        # its own cURL-based HTTP client with no injectable seam, so it can't
        # be faked without touching app/ code (see that test's own docblock).
        # Excluded here to keep CI itself fully hermetic and immune to
        # Twilio-side flakiness; run it locally without this flag when you
        # want that extra confidence.
        # --exclude-group=mysql : the two InstallerWizardTest "full
        # installation" tests genuinely connect to and migrate a real MySQL
        # database (that live connect-and-migrate is the installer feature
        # itself) — this runner only installs pdo_sqlite/sqlite3 and has no
        # MySQL service container, so they'd fail with "Connection refused"
        # every time. Run them locally against a real MySQL server with
        # `vendor/bin/pest tests/Feature/Installer/InstallerWizardTest.php`.
        # Note: --exclude-group must be repeated per group — a single
        # comma-separated value (--exclude-group=network,mysql) is silently
        # treated as one nonexistent group name and excludes nothing.
        run: vendor/bin/pest --coverage --min=0 --coverage-clover=coverage.xml --exclude-group=network --exclude-group=mysql

      - name: Add coverage summary to the job
        run: |
          php -r '
            $xml = simplexml_load_file("coverage.xml");
            $metrics = $xml->project->metrics;
            $covered = (int) $metrics["coveredstatements"];
            $total = (int) $metrics["statements"];
            $pct = $total > 0 ? round($covered / $total * 100, 1) : 0;
            file_put_contents(getenv("GITHUB_STEP_SUMMARY"), "### Coverage: {$pct}% ({$covered}/{$total} statements)\n", FILE_APPEND);
            file_put_contents("coverage-pct.txt", $pct);
          '

      - name: Upload coverage percent
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pct
          path: coverage-pct.txt

  coverage-badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage percent
        uses: actions/download-artifact@v4
        with:
          name: coverage-pct

      - name: Update coverage badge data
        run: |
          mkdir -p .github/badges
          php -r '
            $pct = (float) file_get_contents("coverage-pct.txt");
            $color = $pct >= 80 ? "brightgreen" : ($pct >= 60 ? "yellow" : "red");
            $badge = [
                "schemaVersion" => 1,
                "label" => "coverage",
                "message" => $pct . "%",
                "color" => $color,
            ];
            file_put_contents(".github/badges/coverage.json", json_encode($badge, JSON_PRETTY_PRINT) . "\n");
          '

      - name: Commit updated badge data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update coverage badge [skip ci]'
          file_pattern: .github/badges/coverage.json
