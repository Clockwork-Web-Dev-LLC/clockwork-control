; Supervisor program for the plugin-updates queue workers.
;
; Install on a fresh box:
;   sudo ln -s /var/www/clockwork/deploy/supervisor/clockwork-plugin-updates.conf \
;     /etc/supervisor/conf.d/clockwork-plugin-updates.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status clockwork-plugin-updates:*
;
; Update artisan path or user if your deploy layout differs.
;
; tries=1: never auto-retry an update — WP file replacement is not idempotent.
; timeout=300: covers worst-case core upgrade (~5 min); plugin/theme jobs set
;   their own per-job timeout (180s) which is the effective limit.
; backoff=30: re-queued lock-fail jobs (release(15) in AbstractRunUpdate) ride
;   on top of this.
; max-time=3600: each worker recycles every hour to release leaked memory.
; numprocs=4: tuned for typical fleet size — increase if batches consistently
;   pile up; per-site Cache::lock guarantees no two workers race the same site.

[program:clockwork-plugin-updates]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/clockwork/artisan queue:work --queue=plugin-updates --tries=1 --timeout=300 --backoff=30 --max-time=3600
autostart=true
autorestart=true
numprocs=4
user=clockwork
redirect_stderr=true
stdout_logfile=/var/log/clockwork/plugin-updates.log
